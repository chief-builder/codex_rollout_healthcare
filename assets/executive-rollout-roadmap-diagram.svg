<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="700" viewBox="0 0 1672 700" role="img" aria-labelledby="title desc">
  <title id="title">Executive rollout roadmap</title>
  <desc id="desc">Seven gated phases: 0 Foundations, 1 Synthetic pilot, 2 Non-PHI repos, 3 Dashboards, 4 Frontier models (GPT-6 Astra and GPT-6 Sol), 5 Application coding traffic, 6 PHI enablement. Each phase needs signoff before the next starts.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .h1 { font-size: 40px; font-weight: 700; fill: #08265a; }
      .sub { font-size: 21px; fill: #4a5870; }
      .bt { font-size: 23px; font-weight: 700; }
      .b { font-size: 18px; }
      .s { font-size: 16px; fill: #4a5870; }
      .lbl { font-size: 16px; font-weight: 700; }
    </style>
    <marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#08265a"/></marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d5fbf"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d32"/></marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7352d"/></marker>
    <marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1672" height="700" fill="#ffffff"/>
  <text x="836.0" y="58" text-anchor="middle" class="h1">Executive Rollout Roadmap</text>
  <text x="836.0" y="94" text-anchor="middle" class="sub">Controlled rollout from foundations to PHI enablement, with a gate at every phase</text>
  <path d="M128.0 190 H1526.0" stroke="#08265a" stroke-width="4"/>
  <circle cx="128.0" cy="190" r="38" fill="#08265a"/><text x="128.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">0</text>
  <rect x="20" y="260" width="216" height="200" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="128.0" y="298" class="bt" style="fill:#08265a" text-anchor="middle">Foundations</text>
  <text x="128.0" y="332" class="b" text-anchor="middle">Kong, policy service,</text>
  <text x="128.0" y="357" class="b" text-anchor="middle">Runtime Responses,</text>
  <text x="128.0" y="382" class="b" text-anchor="middle">metering,</text>
  <text x="128.0" y="407" class="b" text-anchor="middle">observability</text>
  <path d="M128.0 464 V520" stroke="#08265a" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="20" y="524" width="216" height="110" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="128.0" y="562" class="bt" style="fill:#08265a" text-anchor="middle">GATE</text>
  <text x="128.0" y="596" class="b" text-anchor="middle">Threat model +</text>
  <text x="128.0" y="621" class="b" text-anchor="middle">retention controls</text>
  <circle cx="361.0" cy="190" r="38" fill="#0f766e"/><text x="361.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">1</text>
  <rect x="253" y="260" width="216" height="200" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="361.0" y="298" class="bt" style="fill:#0f766e" text-anchor="middle">Synthetic Pilot</text>
  <text x="361.0" y="332" class="b" text-anchor="middle">3-5 managed Macs,</text>
  <text x="361.0" y="357" class="b" text-anchor="middle">synthetic repos</text>
  <text x="361.0" y="382" class="b" text-anchor="middle">only</text>
  <path d="M361.0 464 V520" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="253" y="524" width="216" height="110" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="361.0" y="562" class="bt" style="fill:#0f766e" text-anchor="middle">GATE</text>
  <text x="361.0" y="596" class="b" text-anchor="middle">No PHI leakage</text>
  <circle cx="594.0" cy="190" r="38" fill="#0f766e"/><text x="594.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">2</text>
  <rect x="486" y="260" width="216" height="200" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="594.0" y="298" class="bt" style="fill:#0f766e" text-anchor="middle">Non-PHI Repos</text>
  <text x="594.0" y="332" class="b" text-anchor="middle">Approved SWE and</text>
  <text x="594.0" y="357" class="b" text-anchor="middle">PM users on non-PHI</text>
  <text x="594.0" y="382" class="b" text-anchor="middle">repositories</text>
  <path d="M594.0 464 V520" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="486" y="524" width="216" height="110" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="594.0" y="562" class="bt" style="fill:#0f766e" text-anchor="middle">GATE</text>
  <text x="594.0" y="596" class="b" text-anchor="middle">Finance validation</text>
  <circle cx="827.0" cy="190" r="38" fill="#08265a"/><text x="827.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">3</text>
  <rect x="719" y="260" width="216" height="200" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="827.0" y="298" class="bt" style="fill:#08265a" text-anchor="middle">Dashboards</text>
  <text x="827.0" y="332" class="b" text-anchor="middle">Adoption, latency,</text>
  <text x="827.0" y="357" class="b" text-anchor="middle">failures, approvals,</text>
  <text x="827.0" y="382" class="b" text-anchor="middle">usage, and cost</text>
  <path d="M827.0 464 V520" stroke="#08265a" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="719" y="524" width="216" height="110" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="827.0" y="562" class="bt" style="fill:#08265a" text-anchor="middle">GATE</text>
  <text x="827.0" y="596" class="b" text-anchor="middle">Operating views</text>
  <circle cx="1060.0" cy="190" r="38" fill="#9a6b13"/><text x="1060.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">4</text>
  <rect x="952" y="260" width="216" height="200" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <text x="1060.0" y="298" class="bt" style="fill:#9a6b13" text-anchor="middle">Frontier Models</text>
  <text x="1060.0" y="332" class="b" text-anchor="middle">Optional gated</text>
  <text x="1060.0" y="357" class="b" text-anchor="middle">GPT-6 Astra and</text>
  <text x="1060.0" y="382" class="b" text-anchor="middle">GPT-6 Sol aliases</text>
  <path d="M1060.0 464 V520" stroke="#9a6b13" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="952" y="524" width="216" height="110" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <text x="1060.0" y="562" class="bt" style="fill:#9a6b13" text-anchor="middle">GATE</text>
  <text x="1060.0" y="596" class="b" text-anchor="middle">Compliance gate</text>
  <circle cx="1293.0" cy="190" r="38" fill="#0f766e"/><text x="1293.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">5</text>
  <rect x="1185" y="260" width="216" height="200" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1293.0" y="298" class="bt" style="fill:#0f766e" text-anchor="middle">App Coding</text>
  <text x="1293.0" y="332" class="b" text-anchor="middle">/ai/dev/coding</text>
  <text x="1293.0" y="357" class="b" text-anchor="middle">synthetic, then</text>
  <text x="1293.0" y="382" class="b" text-anchor="middle">production traffic</text>
  <path d="M1293.0 464 V520" stroke="#0f766e" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="1185" y="524" width="216" height="110" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="1293.0" y="562" class="bt" style="fill:#0f766e" text-anchor="middle">GATE</text>
  <text x="1293.0" y="596" class="b" text-anchor="middle">Same controls</text>
  <circle cx="1526.0" cy="190" r="38" fill="#9a6b13"/><text x="1526.0" y="203" text-anchor="middle" style="fill:#fff;font-size:36px;font-weight:700">6</text>
  <rect x="1418" y="260" width="216" height="200" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <text x="1526.0" y="298" class="bt" style="fill:#9a6b13" text-anchor="middle">PHI Enablement</text>
  <text x="1526.0" y="332" class="b" text-anchor="middle">Only after all</text>
  <text x="1526.0" y="357" class="b" text-anchor="middle">approvals and</text>
  <text x="1526.0" y="382" class="b" text-anchor="middle">safeguards</text>
  <path d="M1526.0 464 V520" stroke="#9a6b13" stroke-width="3" stroke-dasharray="4 6"/>
  <rect x="1418" y="524" width="216" height="110" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <text x="1526.0" y="562" class="bt" style="fill:#9a6b13" text-anchor="middle">GATE</text>
  <text x="1526.0" y="596" class="b" text-anchor="middle">Separate approval</text>
</svg>
