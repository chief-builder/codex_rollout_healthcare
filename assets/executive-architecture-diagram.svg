<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare AI Coding Platform architecture</title>
  <desc id="desc">Codex CLI on managed Macs sends requests through Kong Gateway and the policy service to Amazon Bedrock Runtime, which serves OpenAI GPT-6 models. Codex traces go through an OpenTelemetry Collector to MLflow; Codex logs and metrics go to backend observability. Kong and the policy service send usage events to an append-only metering store and the billing ledger.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .h1 { font-size: 40px; font-weight: 700; fill: #08265a; }
      .sub { font-size: 21px; fill: #4a5870; }
      .bt { font-size: 23px; font-weight: 700; }
      .b { font-size: 18px; }
      .s { font-size: 16px; fill: #4a5870; }
      .lbl { font-size: 16px; font-weight: 700; }
    </style>
    <marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#08265a"/></marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d5fbf"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d32"/></marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7352d"/></marker>
    <marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1600" height="800" fill="#ffffff"/>
  <text x="800.0" y="58" text-anchor="middle" class="h1">Healthcare AI Coding Platform Architecture</text>
  <text x="800.0" y="94" text-anchor="middle" class="sub">Every model request passes Kong and the policy service; telemetry and metering are separate side paths</text>
  <rect x="50" y="150" width="260" height="160" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="70" y="188" class="bt" style="fill:#08265a">Codex CLI</text>
  <text x="70" y="222" class="b">Managed macOS</text>
  <text x="70" y="247" class="b">developer environments</text>
  <rect x="360" y="150" width="260" height="160" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="380" y="188" class="bt" style="fill:#0f766e">Kong Gateway</text>
  <text x="380" y="222" class="b">Token and claims checks,</text>
  <text x="380" y="247" class="b">rate limits, budgets,</text>
  <text x="380" y="272" class="b">metering tap</text>
  <rect x="670" y="150" width="260" height="160" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <text x="690" y="188" class="bt" style="fill:#0f766e">Policy Service</text>
  <text x="690" y="222" class="b">PHI checks, alias</text>
  <text x="690" y="247" class="b">resolution, store=false</text>
  <rect x="980" y="150" width="260" height="160" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <text x="1000" y="188" class="bt" style="fill:#9a6b13">Bedrock Runtime</text>
  <text x="1000" y="222" class="b">Responses API,</text>
  <text x="1000" y="247" class="b">US cross-Region</text>
  <text x="1000" y="272" class="b">inference profiles</text>
  <rect x="1290" y="150" width="260" height="160" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <text x="1310" y="188" class="bt" style="fill:#08265a">OpenAI GPT-6</text>
  <text x="1310" y="222" class="b">Luna, 6.1 Sol,</text>
  <text x="1310" y="247" class="b">Astra, Sol</text>
  <path d="M314 230.0 H354" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <path d="M624 230.0 H664" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <path d="M934 230.0 H974" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <path d="M1244 230.0 H1284" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="50" y="430" width="260" height="120" rx="12" fill="#f2f7ff" stroke="#1d5fbf" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="70" y="468" class="bt" style="fill:#1d5fbf">OTel Collector</text>
  <text x="70" y="502" class="b">Sanitization boundary</text>
  <path d="M180 314 V424" fill="none" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <rect x="360" y="430" width="260" height="120" rx="12" fill="#f2f7ff" stroke="#1d5fbf" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="380" y="468" class="bt" style="fill:#1d5fbf">MLflow</text>
  <text x="380" y="502" class="b">Sanitized traces only</text>
  <text x="380" y="527" class="b">(alias, timing, counts)</text>
  <path d="M314 490 H354" fill="none" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <rect x="360" y="610" width="300" height="120" rx="12" fill="#f2f7ff" stroke="#1d5fbf" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="380" y="648" class="bt" style="fill:#1d5fbf">Backend observability</text>
  <text x="380" y="682" class="b">Codex logs and metrics,</text>
  <text x="380" y="707" class="b">Kong and app telemetry</text>
  <path d="M180 554 V670 H354" fill="none" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <path d="M490 314 V380 H1100 V424" fill="none" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <path d="M800 314 V380" fill="none" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <rect x="980" y="430" width="260" height="120" rx="12" fill="#f3faf3" stroke="#2f7d32" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1000" y="468" class="bt" style="fill:#2f7d32">Metering store</text>
  <text x="1000" y="502" class="b">Append-only, request-</text>
  <text x="1000" y="527" class="b">level system of record</text>
  <rect x="1290" y="430" width="260" height="120" rx="12" fill="#f3faf3" stroke="#2f7d32" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="1310" y="468" class="bt" style="fill:#2f7d32">Billing ledger</text>
  <text x="1310" y="502" class="b">Chargeback and</text>
  <text x="1310" y="527" class="b">showback by team</text>
  <path d="M1244 490 H1284" fill="none" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <path d="M560 770 H620" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <text x="635" y="776" class="s" text-anchor="start">Model request path</text>
  <path d="M890 770 H950" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <text x="965" y="776" class="s" text-anchor="start">Sanitized telemetry</text>
  <path d="M1220 770 H1280" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <text x="1295" y="776" class="s" text-anchor="start">Metering (system of record)</text>
</svg>
