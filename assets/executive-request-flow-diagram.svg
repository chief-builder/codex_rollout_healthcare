<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="900" viewBox="0 0 1900 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex CLI request flow</title>
  <desc id="desc">Six steps: Codex CLI gets a short-lived enterprise token; Kong validates the token, claims, rate limits and budgets; the policy service authorizes the workflow, checks for PHI and resolves the model alias; a retention guard forces store=false with account retention mode none; Amazon Bedrock Runtime serves the OpenAI model through the Responses API; Kong streams the completion back. Kong and policy failures fail closed before Bedrock. Codex sends sanitized traces to MLflow, and the policy service sends usage events to metering.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .h1 { font-size: 40px; font-weight: 700; fill: #08265a; }
      .sub { font-size: 21px; fill: #4a5870; }
      .bt { font-size: 23px; font-weight: 700; }
      .b { font-size: 18px; }
      .s { font-size: 16px; fill: #4a5870; }
      .lbl { font-size: 16px; font-weight: 700; }
    </style>
    <marker id="anavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#08265a"/></marker>
    <marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1d5fbf"/></marker>
    <marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d32"/></marker>
    <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c7352d"/></marker>
    <marker id="ateal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
  </defs>
  <rect width="1900" height="900" fill="#ffffff"/>
  <text x="950.0" y="58" text-anchor="middle" class="h1">Codex CLI Request Flow</text>
  <text x="950.0" y="94" text-anchor="middle" class="sub">Gateway controls, Bedrock Runtime invocation, and separated telemetry</text>
  <rect x="55" y="150" width="265" height="170" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <circle cx="85" cy="180" r="16" fill="#08265a"/><text x="85" y="187" text-anchor="middle" class="lbl" style="fill:#fff">1</text>
  <text x="111" y="188" class="bt" style="fill:#08265a">Codex CLI</text>
  <text x="75" y="222" class="b">Managed Mac gets</text>
  <text x="75" y="247" class="b">short-lived</text>
  <text x="75" y="272" class="b">enterprise token</text>
  <rect x="360" y="150" width="265" height="170" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <circle cx="390" cy="180" r="16" fill="#08265a"/><text x="390" y="187" text-anchor="middle" class="lbl" style="fill:#fff">2</text>
  <text x="416" y="188" class="bt" style="fill:#08265a">Kong</text>
  <text x="380" y="222" class="b">Validates token,</text>
  <text x="380" y="247" class="b">claims, rate limits,</text>
  <text x="380" y="272" class="b">and budgets</text>
  <path d="M324 235.0 H355" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="665" y="150" width="265" height="170" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="695" cy="180" r="16" fill="#0f766e"/><text x="695" y="187" text-anchor="middle" class="lbl" style="fill:#fff">3</text>
  <text x="721" y="188" class="bt" style="fill:#0f766e">Policy Service</text>
  <text x="685" y="222" class="b">Authorizes workflow,</text>
  <text x="685" y="247" class="b">checks PHI, resolves</text>
  <text x="685" y="272" class="b">model alias</text>
  <path d="M629 235.0 H660" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="970" y="150" width="265" height="170" rx="12" fill="#effaf8" stroke="#0f766e" stroke-width="2.5"/>
  <circle cx="1000" cy="180" r="16" fill="#0f766e"/><text x="1000" y="187" text-anchor="middle" class="lbl" style="fill:#fff">4</text>
  <text x="1026" y="188" class="bt" style="fill:#0f766e">Retention Guard</text>
  <text x="990" y="222" class="b">Forces store=false;</text>
  <text x="990" y="247" class="b">account retention</text>
  <text x="990" y="272" class="b">mode is none</text>
  <path d="M934 235.0 H965" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="1275" y="150" width="265" height="170" rx="12" fill="#fff8e8" stroke="#9a6b13" stroke-width="2.5"/>
  <circle cx="1305" cy="180" r="16" fill="#9a6b13"/><text x="1305" y="187" text-anchor="middle" class="lbl" style="fill:#fff">5</text>
  <text x="1331" y="188" class="bt" style="fill:#9a6b13">Bedrock Runtime</text>
  <text x="1295" y="222" class="b">Responses API serves</text>
  <text x="1295" y="247" class="b">GPT-6 model in a</text>
  <text x="1295" y="272" class="b">US Region</text>
  <path d="M1239 235.0 H1270" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="1580" y="150" width="265" height="170" rx="12" fill="#f5f8fc" stroke="#08265a" stroke-width="2.5"/>
  <circle cx="1610" cy="180" r="16" fill="#08265a"/><text x="1610" y="187" text-anchor="middle" class="lbl" style="fill:#fff">6</text>
  <text x="1636" y="188" class="bt" style="fill:#08265a">Response</text>
  <text x="1600" y="222" class="b">Kong streams the</text>
  <text x="1600" y="247" class="b">completion back</text>
  <text x="1600" y="272" class="b">to Codex</text>
  <path d="M1544 235.0 H1575" fill="none" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <rect x="55" y="470" width="340" height="170" rx="12" fill="#f2f7ff" stroke="#1d5fbf" stroke-width="2.5"/>
  <text x="75" y="508" class="bt" style="fill:#1d5fbf">MLflow Observability</text>
  <text x="75" y="542" class="b">Sanitized Codex traces:</text>
  <text x="75" y="567" class="b">requested alias, timing,</text>
  <text x="75" y="592" class="b">tool categories</text>
  <path d="M187.5 324 V464" fill="none" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <rect x="440" y="470" width="560" height="170" rx="12" fill="#fff5f5" stroke="#c7352d" stroke-width="2.5"/>
  <text x="460" y="508" class="bt" style="fill:#c7352d">Fail Closed Before Bedrock</text>
  <text x="460" y="542" class="b">Unauthorized user, non-coding workflow,</text>
  <text x="460" y="567" class="b">PHI risk, over-budget request,</text>
  <text x="460" y="592" class="b">disallowed alias, or missing store=false</text>
  <path d="M492.5 324 V464" fill="none" stroke="#c7352d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ared)"/>
  <path d="M757.5 324 V464" fill="none" stroke="#c7352d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ared)"/>
  <rect x="1100" y="470" width="745" height="170" rx="12" fill="#f3faf3" stroke="#2f7d32" stroke-width="2.5"/>
  <text x="1120" y="508" class="bt" style="fill:#2f7d32">Metering and Chargeback</text>
  <text x="1120" y="542" class="b">Authoritative usage events: served model,</text>
  <text x="1120" y="567" class="b">tokens, cost, status, and request ID</text>
  <text x="1120" y="592" class="b">(no prompts or completions)</text>
  <path d="M837.5 324 V400 H1470 V464" fill="none" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <rect x="55" y="690" width="1790" height="110" rx="12" fill="#ffffff" stroke="#d9e0ea" stroke-width="2.5"/>
  <text x="75" y="728" class="bt" style="fill:#08265a">Security by Design</text>
  <text x="120" y="775" class="b" text-anchor="start">Identity from validated claims</text>
  <text x="550" y="775" class="b" text-anchor="start">SWE and PM users only</text>
  <text x="980" y="775" class="b" text-anchor="start">Coding workflows only</text>
  <text x="1410" y="775" class="b" text-anchor="start">No raw prompts, PHI, tokens or cost in MLflow</text>
  <path d="M160 850 H220" stroke="#08265a" stroke-width="3" marker-end="url(#anavy)"/>
  <text x="235" y="856" class="s" text-anchor="start">Primary request path</text>
  <path d="M490 850 H550" stroke="#c7352d" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ared)"/>
  <text x="565" y="856" class="s" text-anchor="start">Fail-closed path</text>
  <path d="M820 850 H880" stroke="#1d5fbf" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#ablue)"/>
  <text x="895" y="856" class="s" text-anchor="start">Sanitized observability</text>
  <path d="M1150 850 H1210" stroke="#2f7d32" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#agreen)"/>
  <text x="1225" y="856" class="s" text-anchor="start">Metering system of record</text>
</svg>
